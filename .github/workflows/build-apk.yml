name: Build Tawq Captain APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" -type f | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create WebView Android project
        run: |
          mkdir -p app/src/main/java/com/altawq/captain app/src/main/res/layout app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "TawqCaptain"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
            id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.altawq.captain'
            compileSdk 34

            defaultConfig {
              applicationId 'com.altawq.captain'
              minSdk 23
              targetSdk 34
              versionCode 1
              versionName '1.0.0'
            }

            buildTypes {
              release {
                minifyEnabled false
              }
              debug {
                minifyEnabled false
              }
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }

          dependencies {
            implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
              android:label="الطوق"
              android:usesCleartextTraffic="false"
              android:theme="@style/Theme.AppCompat.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
            <string name="app_name">الطوق</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#1a1614">
            <WebView
              android:id="@+id/webView"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          </FrameLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/altawq/captain/MainActivity.java
          package com.altawq.captain;

          import android.annotation.SuppressLint;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
            private static final String PORTAL_URL = "https://ahmdaltawq-commits.github.io/tawq-captain/";
            private WebView webView;

            @SuppressLint("SetJavaScriptEnabled")
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              setContentView(R.layout.activity_main);

              webView = findViewById(R.id.webView);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setLoadWithOverviewMode(true);
              s.setUseWideViewPort(true);

              webView.setWebViewClient(new WebViewClient() {
                @Override
                public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                  Uri uri = request.getUrl();
                  String u = uri.toString();
                  String h = uri.getHost() != null ? uri.getHost() : "";
                  if (u.startsWith("whatsapp://") || u.startsWith("intent://") || h.contains("wa.me") || h.contains("whatsapp.com")) {
                    try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                      return true;
                    } catch (Exception ignored) {
                      return false;
                    }
                  }
                  return false;
                }
              });

              webView.loadUrl(PORTAL_URL);
            }

            @Override
            public void onBackPressed() {
              if (webView != null && webView.canGoBack()) {
                webView.goBack();
              } else {
                super.onBackPressed();
              }
            }
          }
          EOF

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tawq-captain-apk
          path: app/build/outputs/apk/debug/app-debug.apk
