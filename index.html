<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241f1c">
<meta name="application-name" content="الطوق — بوابة الكابتن">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الطوق">
<link rel="manifest" href="manifest.json">
<title>بوابة الكابتن — الطوق</title>
<style>
:root{--bg:#1a1614;--hero:#241f1c;--cd:#2a2421;--in:#201b18;--bd:#3b332e;--tx:#f4efe8;--mu:#a89e94;--ac:#8fe3a3;--ac2:#5fc47c;--bad:#ff8080;--wa:#f2c36b;--nav:#1e1917}
:root[data-theme="light"]{--bg:#f3f6f4;--hero:#eaf2ec;--cd:#ffffff;--in:#f7faf8;--bd:#dce5df;--tx:#18241d;--mu:#5c6e63;--ac:#12a150;--ac2:#0e8742;--bad:#d9383a;--wa:#c87a00;--nav:#ffffff}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:15px;padding-bottom:calc(82px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}
.hero{background:var(--hero);border-bottom:1px solid var(--bd);padding:max(14px,env(safe-area-inset-top)) 14px 0;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:auto -20% -60% -20%;height:70%;background:radial-gradient(ellipse at center,rgba(143,227,163,.16),transparent 65%);pointer-events:none}
.hero .in{max-width:760px;margin:0 auto;position:relative}
.logo{display:block;margin:0 auto;width:min(165px,44vw);height:auto;border-radius:50%}
.logo.big{width:min(220px,58vw)}
.who{text-align:center;padding:4px 0 12px}
.who b{display:block;font-size:20px;font-weight:800}
.who span{color:var(--mu);font-size:13px}
.bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 0 12px}
.ln{height:3px;background:linear-gradient(90deg,transparent,var(--ac),transparent);opacity:.7}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:15px 16px;margin:12px 0;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.login{max-width:410px;margin:0 auto}
h1{font-size:20px;margin:6px 0 2px;text-align:center}
h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--ac)}
.sub{color:var(--mu);font-size:13px}.c{text-align:center}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--in);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac2);outline-offset:1px}
.pw{position:relative}.pw .eye{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--mu)}
.btn{width:100%;margin-top:12px;padding:11px 14px;border:0;border-radius:12px;background:linear-gradient(180deg,var(--ac),var(--ac2));color:#102016;font:inherit;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
:root[data-theme="light"] .btn{color:#fff}
.btn:disabled{opacity:.55}.btn.sm{width:auto;margin:0;padding:6px 12px;font-size:12px;font-weight:700;border-radius:10px}
.btn.gh{background:var(--in);color:var(--tx);border:1px solid var(--bd);font-weight:600}
.btn.wa{background:#25D366;color:#fff}
.msg{margin-top:10px;padding:9px 12px;border-radius:10px;font-size:13px;display:none;white-space:pre-wrap}
.msg.er{display:block;background:rgba(255,128,128,.13);color:var(--bad)}.msg.ok{display:block;background:rgba(143,227,163,.13);color:var(--ac)}
.note{border-color:var(--wa);background:rgba(242,195,107,.1);color:var(--tx)}
.tabs{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:12px 0 4px;padding-bottom:4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;white-space:nowrap;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:99px;padding:7px 16px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#102016;border-color:var(--ac);font-weight:800}
:root[data-theme="light"] .tabs button.on{color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.k{background:var(--in);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;border-top:2px solid var(--ac2)}
.k .l{font-size:12px;color:var(--mu)}.k .v{font-size:23px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}.k .s{font-size:11px;color:var(--mu)}
.b{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.g{background:rgba(143,227,163,.16);color:var(--ac)}.r{background:rgba(255,128,128,.16);color:var(--bad)}.y{background:rgba(242,195,107,.18);color:var(--wa)}.z{background:var(--bd);color:var(--mu)}
.bar2{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0 4px}.bar2 i{display:block;height:100%;background:var(--ac2);transition:width .3s}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}th{color:var(--mu);font-weight:600}
tr.pre td{opacity:.55}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row .t{flex:1}.row .a{font-weight:800;white-space:nowrap}
.ap-box{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--in);border:1px solid var(--bd)}
.rep-box{margin-top:6px;padding:8px 11px;border-radius:10px;font-size:13px;line-height:1.7;border-right:3px solid var(--ac)}
.rep-box.ok{background:rgba(143,227,163,.1);border-right-color:var(--ac)}
.rep-box.no{background:rgba(255,128,128,.1);border-right-color:var(--bad)}
.tot{display:flex;justify-content:space-between;margin-top:8px;font-weight:800;padding-top:8px;border-top:2px solid var(--bd)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bdg-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--in);border:1px solid var(--bd)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--nav);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 20px rgba(0,0,0,.2)}
.bnav button{flex:1;border:0;background:transparent;color:var(--mu);font:inherit;font-size:11px;padding:4px 2px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.bnav button.on{color:var(--ac);font-weight:800}
.bnav .ico{font-size:19px;line-height:1.1}
.bnav .dot{position:absolute;top:2px;right:calc(50% - 20px);background:var(--bad);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:0 5px;min-width:16px}
.spin{width:34px;height:34px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite;margin:14px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.sync-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ac);background:rgba(143,227,163,.12);padding:3px 10px;border-radius:99px;margin-top:4px}
.pwa-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,rgba(143,227,163,.16),rgba(95,196,124,.08));border:1px solid var(--ac2);border-radius:14px;padding:10px 14px;margin:10px 0}
.pwa-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px}
.pwa-modal .box{background:var(--cd);border:1px solid var(--bd);border-radius:18px;max-width:410px;width:100%;padding:18px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.foot{text-align:center;color:var(--mu);font-size:12px;margin:18px 0 6px}
</style>
</head>
<body>
<div id="app">
  <div class="hero">
    <div class="in" style="text-align:center;padding:24px 0">
      <div class="spin"></div>
      <p class="sub c">جارٍ تشغيل تطبيق الطوق...</p>
    </div>
  </div>
  <div class="ln"></div>
</div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbySqlF_UAQNXO5svxd-ThRXrwNLCUCvtamfvph2cORkWyw2BzNInO2wTGfER7HnLdB7/exec';
var LOGO = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">' +
  '<rect width="512" height="512" fill="#231c19"/>' +
  '<ellipse cx="256" cy="256" rx="228" ry="168" fill="#141414"/>' +
  '<ellipse cx="256" cy="256" rx="212" ry="153" fill="none" stroke="#b9df86" stroke-width="6"/>' +
  '<g transform="translate(256,174)" fill="none" stroke="#a6c978" stroke-width="7">' +
  '<path d="M-24,-24 A34,20 0 0,1 22,-25"/><polygon points="18,-35 34,-21 15,-14" fill="#a6c978" stroke="none"/>' +
  '<path d="M36,-4 A34,20 0 0,1 26,22"/><polygon points="36,18 22,34 15,15" fill="#a6c978" stroke="none"/>' +
  '<path d="M24,24 A34,20 0 0,1 -22,25"/><polygon points="-18,35 -34,21 -15,14" fill="#a6c978" stroke="none"/>' +
  '<path d="M-36,4 A34,20 0 0,1 -26,-22"/><polygon points="-36,-18 -22,-34 -15,-15" fill="#a6c978" stroke="none"/>' +
  '</g>' +
  '<text x="256" y="274" text-anchor="middle" font-size="60" font-weight="800" letter-spacing="3" fill="#b9df86" font-family="Trebuchet MS,Tahoma,Arial,sans-serif">AL TAWQ</text>' +
  '<text x="256" y="314" text-anchor="middle" font-size="23" font-weight="600" letter-spacing="2" fill="#8fa96a" font-family="Trebuchet MS,Tahoma,Arial,sans-serif">AT YOUR SERVICE</text>' +
  '</svg>'
);

window.onerror = function(m, u, l) {
  var el = document.getElementById('app');
  if (el) el.innerHTML = '<div class="wrap"><div class="card"><h2 style="color:var(--bad)">تنبيه تقني</h2><div class="sub" style="direction:ltr;text-align:left">' + String(m) + ' (Line ' + l + ')</div><button class="btn" onclick="localStorage.clear();location.reload()">إعادة ضبط</button></div></div>';
};

function callApi(action, payload, onOk, onErr) {
  var cbName = '_tawqCb_' + Math.random().toString(36).slice(2, 10);
  var sc = document.createElement('script');
  var timer = setTimeout(function() {
    cleanup();
    if (onErr) onErr(new Error('انتهت مهلة الاتصال بالخادم'));
  }, 25000);
  function cleanup() {
    clearTimeout(timer);
    try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
    if (sc && sc.parentNode) sc.parentNode.removeChild(sc);
  }
  window[cbName] = function(res) {
    cleanup();
    if (onOk) onOk(res);
  };
  var q = API_URL + (API_URL.indexOf('?') > -1 ? '&' : '?') +
    'action=' + encodeURIComponent(action) +
    '&callback=' + encodeURIComponent(cbName) +
    '&d=' + encodeURIComponent(JSON.stringify(payload || {}));
  sc.src = q;
  sc.onerror = function() {
    cleanup();
    if (onErr) onErr(new Error('تعذر الاتصال بالخادم — تأكد من نشر Apps Script بصلاحية Anyone'));
  };
  document.body.appendChild(sc);
}

var PWA_PROMPT = null;
var IS_STANDALONE = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  PWA_PROMPT = e;
  if (typeof DATA !== 'undefined' && DATA && typeof mainView === 'function') mainView();
  else if (typeof loginView === 'function' && !TOKEN) loginView();
});
window.addEventListener('appinstalled', function() { PWA_PROMPT = null; IS_STANDALONE = true; });

function pwaInstallNow() {
  if (PWA_PROMPT) {
    PWA_PROMPT.prompt();
    PWA_PROMPT.userChoice.then(function() {
      PWA_PROMPT = null;
      if (DATA) mainView(); else loginView();
    });
    return;
  }
  pwaHelp();
}

function pwaHelp() {
  var old = document.getElementById('pwaModal');
  if (old) old.remove();
  var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  var steps = isIOS
    ? '<li>اضغط على زر <b>المشاركة (Share)</b> في شريط متصفح Safari بالأسفل.</li><li>مرّر القائمة واختر <b>«إضافة إلى الشاشة الرئيسية» (Add to Home Screen)</b>.</li><li>اضغط <b>إضافة (Add)</b> ليظهر تطبيق <b>الطوق</b> بشعار الشركة على شاشتك.</li>'
    : '<li>اضغط على أيقونة القائمة <b>(⋮)</b> في أعلى يسار متصفح Chrome.</li><li>اختر <b>«تثبيت التطبيق» (Install app)</b> أو <b>«الإضافة إلى الشاشة الرئيسية»</b>.</li><li>اضغط <b>تثبيت</b> ليظهر تطبيق <b>الطوق</b> بشعار الشركة مثل أي تطبيق آخر.</li>';
  document.body.insertAdjacentHTML('beforeend',
    '<div id="pwaModal" class="pwa-modal" onclick="if(event.target===this)this.remove()"><div class="box">' +
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px"><img src="' + LOGO + '" style="width:58px;height:58px;border-radius:14px;border:1px solid var(--bd)">' +
    '<div><b style="font-size:16px">تثبيت تطبيق الطوق</b><div class="sub">وصول سريع بشعار الشركة وبدون متصفح</div></div></div>' +
    '<ol style="margin:10px 0 14px;padding-right:20px;line-height:1.9;font-size:13px">' + steps + '</ol>' +
    '<button class="btn" onclick="document.getElementById(\'pwaModal\').remove()">فهمت</button></div></div>'
  );
}

var TOKEN = '', DATA = null, WSEL = 'all', TAB = 'perf', NEEDID = false, PHV = '', BUSY = false, SYNCING = false, EXT_LOADING = false, LOAD_TMR = null;
var LV = { date: '', text: '', msg: '', ok: false };
var CACHE_KEY = 'cap_fast_cache_v8';

try {
  TOKEN = localStorage.getItem('cap_tok') || '';
  var th = localStorage.getItem('cap_th');
  if (th) document.documentElement.setAttribute('data-theme', th);
  var saved = localStorage.getItem(CACHE_KEY);
  if (TOKEN && saved) { DATA = JSON.parse(saved); }
} catch (e) {}

function $(i) { return document.getElementById(i); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function money(n) { return Number(n || 0).toLocaleString('en-US'); }
function f1(v) { return String(Math.round(v || 0)); }
function r1(v) { return String(Math.round((v || 0) * 10) / 10); }
function arC(v) { return v >= 90 ? 'g' : v >= 75 ? 'y' : 'r'; }
function scC(v) { return v >= 85 ? 'g' : v >= 55 ? 'y' : 'r'; }
function setTok(t) {
  TOKEN = t || '';
  try { if (t) localStorage.setItem('cap_tok', t); else { localStorage.removeItem('cap_tok'); localStorage.removeItem(CACHE_KEY); } } catch (e) {}
}
function saveCache(d) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch (e) {} }
function app(h) { $('app').innerHTML = h; }
function say(t, ok) { var m = $('msg'); if (!m) return; m.className = t ? ('msg ' + (ok ? 'ok' : 'er')) : 'msg'; m.textContent = t; }
function busy(b) { BUSY = b; var g = $('go'); if (g) g.disabled = b; }
function eye(id) { var i = $(id); i.type = i.type === 'password' ? 'text' : 'password'; }
function toggleTheme() {
  var r = document.documentElement, cur = r.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  if (cur === 'dark') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', 'light');
  try { localStorage.setItem('cap_th', cur); } catch (e) {}
}
document.addEventListener('keydown', function(e) { if (e.key === 'Enter' && e.target && e.target.tagName === 'INPUT') { var g = $('go'); if (g && !g.disabled) g.click(); } });
function fail(e) { busy(false); say((e && e.message) || 'تعذر الاتصال بالخادم'); }
function hero(inner, big) { return '<div class="hero"><div class="in"><img class="logo' + (big ? ' big' : '') + '" src="' + LOGO + '" alt="الطوق — AL TAWQ">' + inner + '</div></div><div class="ln"></div>'; }

function pwaBannerHtml() {
  if (IS_STANDALONE) return '';
  return '<div class="pwa-banner"><div style="display:flex;align-items:center;gap:10px"><img src="' + LOGO + '" style="width:40px;height:40px;border-radius:10px"><div><b style="font-size:13px">ثبّت تطبيق الطوق على هاتفك</b><div class="sub" style="font-size:11px">وصول سريع بشعار الشركة وبدون متصفح</div></div></div>' +
    '<button class="btn sm" onclick="pwaInstallNow()">📲 ' + (PWA_PROMPT ? 'تثبيت الآن' : 'تثبيت التطبيق') + '</button></div>';
}

function loginView(m) {
  app(hero('<h1>بوابة الكابتن</h1><p class="sub c" style="margin:0 0 16px">سجّل الدخول برقم هاتفك وكلمة المرور (يبقى الدخول محفوظاً 30 يوماً)</p>', true) +
    '<div class="wrap">' + pwaBannerHtml() + '<div class="card login">' +
    '<label>رقم الهاتف</label><input id="ph" type="tel" inputmode="tel" autocomplete="username" placeholder="07XXXXXXXXX" dir="ltr" value="' + esc(PHV) + '">' +
    (NEEDID ? '<label>رقم الـ ID</label><input id="cid" inputmode="numeric" dir="ltr">' : '') +
    '<label>كلمة المرور</label><div class="pw"><input id="pw" type="password" autocomplete="current-password" dir="ltr"><button type="button" class="eye" onclick="eye(\'pw\')" aria-label="إظهار">👁</button></div>' +
    '<div id="msg" class="msg"></div><button class="btn" id="go" onclick="doLogin()">دخول</button>' +
    '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn sm gh" style="flex:1" onclick="toggleTheme()">🌓 المظهر</button><button class="btn sm gh" style="flex:1" onclick="pwaInstallNow()">📲 تثبيت كتطبيق</button></div></div>' +
    '<div class="foot">الطوق — شريك التوصيل لتطبيق Baly</div></div>');
  if (m) say(m);
}

function doLogin() {
  if (BUSY) return;
  PHV = $('ph').value;
  var cid = $('cid') ? $('cid').value : '';
  busy(true);
  say('');
  callApi('login', { phone: PHV, pass: $('pw').value, cid: cid }, function(r) {
    busy(false);
    if (!r || !r.ok) {
      if (r && r.needId) NEEDID = true;
      loginView((r && r.err) || 'تعذر الدخول');
      return;
    }
    setTok(r.token);
    if (r.must) changeView(true, '');
    else load(true);
  }, fail);
}

function logout() {
  try { callApi('logout', { token: TOKEN }); } catch (e) {}
  setTok('');
  DATA = null;
  loginView();
}

function changeView(forced, m) {
  app(hero('<h1>' + (forced ? 'اختر كلمة مرور جديدة' : 'تغيير كلمة المرور') + '</h1><p class="sub c" style="margin:0 0 16px">' + (forced ? 'هذه أول مرة تدخل — غيّر الكلمة المؤقتة للمتابعة' : 'اكتب كلمتك الحالية ثم الجديدة') + '</p>') +
    '<div class="wrap"><div class="card login">' +
    '<label>' + (forced ? 'الكلمة المؤقتة' : 'كلمة المرور الحالية') + '</label><div class="pw"><input id="o" type="password" dir="ltr" autocomplete="current-password"><button type="button" class="eye" onclick="eye(\'o\')">👁</button></div>' +
    '<label>كلمة المرور الجديدة (6 على الأقل)</label><div class="pw"><input id="n1" type="password" dir="ltr" autocomplete="new-password"><button type="button" class="eye" onclick="eye(\'n1\')">👁</button></div>' +
    '<label>أعد كتابة الجديدة</label><input id="n2" type="password" dir="ltr" autocomplete="new-password">' +
    '<div id="msg" class="msg"></div><button class="btn" id="go" onclick="doChange(' + (forced ? 1 : 0) + ')">حفظ</button>' +
    (forced ? '' : '<button class="btn gh" onclick="mainView()">رجوع</button>') + '</div></div>');
  if (m) say(m);
}

function doChange(forced) {
  if (BUSY) return;
  var o = $('o').value, a = $('n1').value, b = $('n2').value;
  if (a !== b) { say('الكلمتان غير متطابقتين'); return; }
  busy(true);
  say('');
  callApi('pass', { token: TOKEN, oldp: o, newp: a }, function(r) {
    busy(false);

          '<span class="b y">⏳ بانتظار رد المشرف</span>';
        return '<div class="ap-box" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>📅 إجازة يوم ' + esc(lv.ref) + '</b>' + stB + '</div>' +
          '<div class="sub" style="margin-top:4px"><b>السبب:</b> ' + esc(lv.reason) + ' · <span style="opacity:.8">أُرسل ' + esc(lv.dt) + '</span></div>' +
          (lv.st !== 'pending' ? '<div class="rep-box ' + (lv.st === 'approved' ? 'ok' : 'no') + '"><b>رد المشرف' + (lv.replyBy ? ' (' + esc(lv.replyBy) + ')' : '') + ':</b> ' + (lv.reply ? esc(lv.reply) : (lv.st === 'approved' ? 'تمت الموافقة على الإجازة' : 'تم رفض طلب الإجازة')) + '</div>' : '') +
          '</div>';
      }).join('') : (EXT_LOADING ? '<div class="sub" style="margin-top:10px">⏳ جارٍ تحميل طلبات الإجازة...</div>' : '')) + '</div>';
  }
  if (S.rew) h += '<div class="card"><h2>🏅 سجل المكافآت</h2>' + listFin(rew, 'ac') + '</div>';
  if (S.ded) h += '<div class="card"><h2>💸 سجل الخصومات</h2>' + listFin(ded, 'bad') + '</div>';
  return h;
}

function mainView() {
  var S = DATA.sec, p = DATA.perf, sd = selData(), h = '';
  var unAck = (DATA.fol || []).filter(function(x) { return x.side !== 'C' && !x.ack; }).length;
  var wa = supWaUrl();

  h += hero('<div class="who"><b>' + esc(DATA.name) + '</b><span>ID ' + esc(DATA.id) + (DATA.team ? ' — ضمن فريق ' + esc(DATA.team) : '') + '</span>' +
    (SYNCING || EXT_LOADING ? '<div><span class="sync-pill">🔄 يتحدث بالخلفية...</span></div>' : '') + '</div>' +
    '<div class="bar">' +
    (wa ? '<a class="btn sm wa" href="' + wa + '" target="_blank" rel="noopener">💬 مشرف الفريق</a>' : '') +
    '<button class="btn sm gh" onclick="toggleTheme()">🌓 المظهر</button>' +
    (!IS_STANDALONE ? '<button class="btn sm gh" onclick="pwaInstallNow()">📲 تثبيت</button>' : '') +
    '<button class="btn sm gh" onclick="changeView(false,\'\')">🔒 كلمة المرور</button>' +
    '<button class="btn sm gh" onclick="load(true)">🔄 تحديث</button>' +
    '<button class="btn sm gh" onclick="logout()">خروج</button></div>');

  h += '<div class="wrap">';
  h += pwaBannerHtml();
  if (DATA.note) h += '<div class="card note">📢 ' + esc(DATA.note) + '</div>';
  if (unAck > 0 && TAB !== 'fin') {
    h += '<div class="card" style="border-color:var(--bad);cursor:pointer" onclick="TAB=\'fin\';mainView()"><b style="color:var(--bad)">🔔 لديك ' + unAck + ' تنبيه من الإدارة بانتظار قراءتك — اضغط هنا لعرضه وتأكيد القراءة</b></div>';
  }

  if (p && p.weeks && p.weeks.length) {
    h += '<div class="tabs"><button class="' + (WSEL === 'all' ? 'on' : '') + '" onclick="WSEL=\'all\';mainView()">كل الفترة</button>' +
      p.weeks.map(function(w) { return '<button class="' + (String(WSEL) === String(w.w) ? 'on' : '') + '" onclick="WSEL=' + w.w + ';mainView()">أسبوع ' + w.w + '</button>'; }).join('') + '</div>';
  }

  if (TAB === 'perf') {
    if (sd && sd.none) {
      h += '<div class="card"><h2>📊 أدائي</h2><div class="sub">لم تكن مسجّلاً في هذا الأسبوع، لذلك لا يُحتسب عليك فيه أي غياب.</div></div>';
    } else if (sd && sd.sum) {
      var s = sd.sum;
      if (S.perf) {
        h += '<div class="card"><h2>📊 ملخص أدائي</h2><div class="grid">' +
          K('الطلبات الفعلية', f1(s.ord), 'من ' + f1(s.off) + ' واردة') +
          K('نسبة القبول', '<span class="b ' + arC(s.ar) + '" style="font-size:19px">' + f1(s.ar) + '%</span>', '') +
          K('الحضور', f1(s.dp) + ' / ' + f1(s.dn), s.abs ? 'غياب ' + f1(s.abs) + ' يوم' : 'ملتزم بالكامل ✅', s.abs ? 'bad' : 'ac') +
          K('متوسط الطلبات/يوم', r1(s.avg)) +
          K('ساعات العمل/يوم', r1(s.hv)) +
          K('الطلبات المرفوضة', f1(s.rej), 'متوسط ' + r1(s.dp ? s.rej / s.dp : 0) + '/يوم') +
          (S.score && s.sc != null ? K('التقييم العام', '<span class="b ' + scC(s.sc) + '" style="font-size:19px">' + f1(s.sc) + '</span>', esc(s.gr)) : '') +
          (S.rank && sd.rank ? K('ترتيبي', f1(sd.rank.r), 'من ' + f1(sd.rank.n) + ' كابتن') : '') +
          '</div></div>';
      }
      h += targetsBox(s);
      h += chartAndBadgesBox(sd);
      h += top3Box(sd);
    } else {
      h += '<div class="card"><h2>📊 أدائي</h2><div class="sub">لا توجد بيانات أداء مسجّلة لك حتى الآن.</div></div>';
    }
    h += insBox();
  } else if (TAB === 'days') {
    if (S.days && sd && sd.days && sd.days.length) {
      h += '<div class="card"><h2>📅 سجل أيامي يوماً بيوم</h2><div class="tw"><table><tr><th>اليوم</th><th>الحالة</th><th>الواردة</th><th>الفعلية</th><th>القبول</th><th>الساعات</th><th>الرفض</th></tr>' +
        sd.days.slice().reverse().map(function(o) { return dayRow(o, sd.wk); }).join('') + '</table></div></div>';
    } else {
      h += '<div class="card"><h2>📅 أيامي</h2><div class="sub">لا توجد بيانات أيام متاحة.</div></div>';
    }
  } else if (TAB === 'cont') {
    h += contTab();
  } else if (TAB === 'fin') {
    h += finAndFolTab();
  }

  h += '<div class="foot">الطوق — شريك التوصيل لتطبيق Baly</div></div>';

  h += '<nav class="bnav">' +
    '<button class="' + (TAB === 'perf' ? 'on' : '') + '" onclick="TAB=\'perf\';mainView()"><span class="ico">📊</span><span>أدائي</span></button>' +
    '<button class="' + (TAB === 'days' ? 'on' : '') + '" onclick="TAB=\'days\';mainView()"><span class="ico">📅</span><span>أيامي</span></button>' +
    '<button class="' + (TAB === 'cont' ? 'on' : '') + '" onclick="TAB=\'cont\';mainView()"><span class="ico">🏆</span><span>المسابقة</span></button>' +
    '<button class="' + (TAB === 'fin' ? 'on' : '') + '" onclick="TAB=\'fin\';mainView()"><span class="ico">💼</span><span>المالية والإجازات</span>' + (unAck ? '<span class="dot">' + unAck + '</span>' : '') + '</button>' +
    '</nav>';

  app(h);
}

if (TOKEN) load(false);
else loginView();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').catch(function() {});
  });
}
</script>
</body>
</html>
